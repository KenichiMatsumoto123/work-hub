name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 型チェックの前にビルドが必要（TanStack Start のプラグインが src/routeTree.gen.ts を
      # 生成する。このファイルは gitignore 対象のため、未生成だと tsc がルート定義を解決できない）
      - name: Build
        run: npm run build

      # lint（ESLint / Biome）は未導入のため、静的チェックは型チェックで代替する
      # （docs/開発プロセス/本リポジトリでの読み替え.md 参照）
      - name: Type check
        run: npm run check-types

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/web/coverage/
          retention-days: 7

  db-integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workhub
          POSTGRES_PASSWORD: workhub_dev
          POSTGRES_DB: workhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U workhub"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://workhub:workhub_dev@127.0.0.1:5432/workhub_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # TODO: マイグレーション運用に移行したら drizzle-kit migrate に切り替える
      - name: Apply database schema
        run: npm run db:push -- --force

      - name: Run integration tests
        run: npm run test:integration
