name: Playwright Tests
on:
  pull_request:
    types: [opened]
    branches: [main, master, staging, dev-deploy, develop]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  e2e_test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.3.2
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: e2e_test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/e2e_test_db
      E2E_BASE_URL: http://127.0.0.1:3000
      # TODO: GitHub リポジトリの Settings > Secrets に E2E_EMAIL と E2E_PASSWORD を登録する
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # TODO: マイグレーション運用に移行したら `npx prisma migrate deploy` に切り替える
      - name: Apply database schema
        run: npx prisma db push

      - name: Seed database
        run: npx prisma db seed

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
