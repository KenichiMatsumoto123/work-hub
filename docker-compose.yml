services:
  postgres:
    image: postgres:16-alpine
    container_name: work-hub-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: workhub
      POSTGRES_PASSWORD: workhub_dev
      POSTGRES_DB: workhub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workhub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
